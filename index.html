  :root {
    --bg: #dfd3c3;
    --ink: #221f1f;
    --rust: #9d5937;
    --blush: #c29c87;
    --tracked: 0.16em;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--rust);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .frame {
    position: relative;
    min-height: 100vh;
    padding: 22px;
  }

  .frame::before {
    content: "";
    position: fixed;
    top: 14px; left: 14px; right: 14px; bottom: 14px;
    border: 1px solid var(--ink);
    pointer-events: none;
    z-index: 1;
  }

  .page {
    position: relative;
    z-index: 2;
    max-width: 620px;
    margin: 0 auto;
    min-height: calc(100vh - 44px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 26px 28px 40px;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: var(--tracked);
    text-transform: lowercase;
    color: var(--rust);
    text-align: center;
    margin: 0;
  }

  .mark {
    display: flex;
    justify-content: center;
    margin: 34px 0 26px;
  }

  .mark-img {
    display: block;
    height: 84px;
    width: auto;
  }

  .wheat-icon {
    display: block;
    height: 16px;
    width: auto;
    opacity: 0.9;
  }

  .wheat-icon--small {
    height: 20px;
  }

  .names {
    font-family: 'Bastiken', Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
    font-weight: 400;
    font-size: clamp(30px, 7vw, 46px);
    letter-spacing: 2px;
    text-align: center;
    margin: 0 0 14px;
    line-height: 1.15;
    text-transform: uppercase;
  }

  .subline {
    text-align: center;
    font-size: 11px;
    letter-spacing: var(--tracked);
    text-transform: lowercase;
    margin: 0 0 54px;
    color: var(--rust);
  }

  .subline strong {
    display: block;
    margin-top: 8px;
    font-weight: 600;
    color: var(--ink);
  }

  .wheat-divider {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 0 0 46px;
    opacity: 0.85;
  }

  .wheat-divider .line {
    height: 1px;
    width: 64px;
    background: var(--rust);
    opacity: 0.5;
  }

  .triptych {
    display: flex;
    gap: 18px;
    margin: 0 -28px 44px;
  }

  .triptych figure {
    margin: 0;
    flex: 1 1 0;
    min-width: 0;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--ink);
  }

  .triptych img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .triptych .tri-center img {
    object-position: center 65%;
  }

  .triptych .tri-side:last-child img {
    object-position: center 28%;
  }

  @media (max-width: 460px) {
    .triptych { margin: 0 -18px 38px; gap: 10px; }
  }

  .countdown {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 0;
    margin: 0 0 50px;
  }

  .stat {
    flex: 1 1 0;
    text-align: center;
    padding: 0 10px;
    position: relative;
  }

  .stat + .stat::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8%;
    bottom: 8%;
    width: 1px;
    background: var(--rust);
    opacity: 0.35;
  }

  .stat .num {
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
    font-size: clamp(30px, 8vw, 44px);
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    line-height: 1;
    display: block;
  }

  .stat .label {
    display: block;
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: var(--tracked);
    text-transform: lowercase;
    color: var(--rust);
  }

  .location {
    text-align: center;
    font-size: 11px;
    letter-spacing: var(--tracked);
    text-transform: lowercase;
    margin: 0 0 40px;
  }

  .location .value {
    display: block;
    margin-top: 6px;
    color: var(--ink);
  }

  .cta-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-bottom: 56px;
  }

  .cta {
    appearance: none;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: var(--tracked);
    text-transform: lowercase;
    padding: 15px 34px;
    cursor: pointer;
    transition: background-color 0.25s ease, color 0.25s ease;
    text-decoration: none;
    display: inline-block;
  }

  .cta:hover {
    background: var(--ink);
    color: var(--bg);
  }

  .cta-alt {
    font-size: 10px;
    letter-spacing: var(--tracked);
    text-transform: lowercase;
    color: var(--rust);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .cta-alt:hover {
    border-bottom-color: var(--rust);
  }

  footer {
    text-align: center;
  }

  footer .foot-wheat {
    display: flex;
    justify-content: center;
    margin-bottom: 14px;
    opacity: 0.8;
  }

  footer p {
    margin: 0;
    font-size: 10px;
    letter-spacing: var(--tracked);
    text-transform: lowercase;
    color: var(--rust);
  }

  footer .url {
    margin-top: 6px;
    font-weight: 600;
    color: var(--ink);
  }

  @media (max-width: 420px) {
    .page { padding: 20px 18px 30px; }
    .countdown { gap: 0; }
    .stat { padding: 0 4px; }
  }
</style>
</head>

<script>
  // ---- Configure these when the details are confirmed ----
  const WEDDING_DATE_ISO = "2027-06-05"; // YYYY-MM-DD, all-day
  const WEDDING_LABEL = "5 · 06 · 2027";
  const LOCATION_TEXT = "to be revealed";
  const EVENT_TITLE = "Melissa & Sander 💍 Wedding Day";
  const EVENT_DESCRIPTION = "We're getting married! Countdown with us at wedding.gheestriems.be. Location to be revealed soon.";
  // ----------------------------------------------------------

  document.getElementById('dateLine').textContent = WEDDING_LABEL;
  document.getElementById('locationValue').textContent = LOCATION_TEXT;

  const target = new Date(WEDDING_DATE_ISO + "T00:00:00");

  function pad(n) { return String(n).padStart(2, "0"); }

  function tick() {
    const now = new Date();
    let diff = target - now;
    const els = {
      d: document.getElementById('d'),
      h: document.getElementById('h'),
      m: document.getElementById('m'),
      s: document.getElementById('s'),
    };
    if (diff <= 0) {
      els.d.textContent = "💍";
      els.h.textContent = "💍";
      els.m.textContent = "💍";
      els.s.textContent = "💍";
      document.querySelector('.eyebrow').textContent = "we did it";
      return;
    }
    const day = Math.floor(diff / 86400000);
    diff -= day * 86400000;
    const hr = Math.floor(diff / 3600000);
    diff -= hr * 3600000;
    const min = Math.floor(diff / 60000);
    diff -= min * 60000;
    const sec = Math.floor(diff / 1000);

    els.d.textContent = pad(day);
    els.h.textContent = pad(hr);
    els.m.textContent = pad(min);
    els.s.textContent = pad(sec);
  }

  tick();
  setInterval(tick, 1000);

  function icsDateAllDay(iso) {
    return iso.replace(/-/g, "");
  }

  function icsDateAllDayNextDay(iso) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + 1);
    const y = d.getFullYear();
    const m = pad(d.getMonth() + 1);
    const day = pad(d.getDate());
    return `${y}${m}${day}`;
  }

  function dtstamp() {
    const n = new Date();
    return n.getUTCFullYear() +
      pad(n.getUTCMonth() + 1) +
      pad(n.getUTCDate()) + "T" +
      pad(n.getUTCHours()) +
      pad(n.getUTCMinutes()) +
      pad(n.getUTCSeconds()) + "Z";
  }

  function escapeICS(text) {
    return text.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  }

  function buildICS() {
    const start = icsDateAllDay(WEDDING_DATE_ISO);
    const end = icsDateAllDayNextDay(WEDDING_DATE_ISO);
    const lines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Melissa & Sander//Wedding//EN",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:melissa-sander-wedding-" + start + "@wedding.gheestriems.be",
      "DTSTAMP:" + dtstamp(),
      "DTSTART;VALUE=DATE:" + start,
      "DTEND;VALUE=DATE:" + end,
      "SUMMARY:" + escapeICS(EVENT_TITLE),
      "DESCRIPTION:" + escapeICS(EVENT_DESCRIPTION),
      "LOCATION:" + escapeICS(LOCATION_TEXT),
      "END:VEVENT",
      "END:VCALENDAR"
    ];
    return lines.join("\r\n");
  }

  function buildICSDataUri() {
    const ics = buildICS();
    return "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
  }

  // No download attribute on purpose: pointing the browser straight at a
  // text/calendar resource is what makes iOS/macOS Safari (and most mail/
  // calendar-aware browsers) hand it to the Calendar app directly with an
  // "add this event" prompt, instead of saving a file to Downloads.
  document.getElementById('icsBtn').setAttribute('href', buildICSDataUri());

  function buildGoogleCalendarUrl() {
    const start = icsDateAllDay(WEDDING_DATE_ISO);
    const end = icsDateAllDayNextDay(WEDDING_DATE_ISO);
    const params = new URLSearchParams({
      action: "TEMPLATE",
      text: EVENT_TITLE,
      dates: start + "/" + end,
      details: EVENT_DESCRIPTION,
      location: LOCATION_TEXT
    });
    return "https://calendar.google.com/calendar/render?" + params.toString();
  }

  document.getElementById('gcalBtn').href = buildGoogleCalendarUrl();
</script>
